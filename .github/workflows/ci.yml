name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 26 only (owner decision 2026-10-31).
        node: [26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: bash scripts/check-ui-standard.sh
      - run: PORT=7810 npm run doctor
  # The browser run (scripts/e2e.mjs): starts the lab on its port and drives the dashboard, use cases and
  # guide in headless Chromium — desktop and 375px, dark and light. Screenshots on failure.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
        env:
          E2E_SHOTS: ${{ runner.temp }}/e2e-screenshots
      - name: Screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-screenshots

  # The real-Docker smoke: build the image, run it with no network access to the app's dependencies and
  # answer /api/health. The lab is mock-only by default, so the container must come up cold.
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: docker build -t ai-demo-standalone-smoke .
      - run: |
          docker run -d --name smoke -p 7810:7810 ai-demo-standalone-smoke
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:7810/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q 'demo-health/1' /tmp/health.json
          docker rm -f smoke > /dev/null

  # The brain sidecar (P2b): Python tests with the scripted tool-calling ChatModel (no live LLM).
  # Pinned versions, GitHub-hosted (the owner's 2026-11-10 waiver of the Node-26-only rule for this
  # one job). The sidecar is OFF by default; this job only proves its slice works and imports clean.
  brain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -r brain/requirements.txt pytest
      - run: python -m pytest brain/tests/test_brain.py -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/
      - run: gitleaks detect --source . --redact -v
      - name: forbidden strings (history of main)
        env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          if [ -z "$FORBIDDEN_STRINGS" ]; then echo "FORBIDDEN_STRINGS secret missing"; exit 1; fi
          printf '%s\n' "$FORBIDDEN_STRINGS" > /tmp/forbidden-strings.txt
          # Scan main's reachable history only (the durable record). --all also walks stale refs and dangling
          # pre-rebase objects, which made the verdict depend on whatever branches happened to exist at run time
          # (a same-commit green-then-red pair on 2026-11-11 proved it). New commits arrive via PR onto main,
          # so main's history covers everything that was ever merged.
          hits=$(git log -p origin/main | grep -cF -f /tmp/forbidden-strings.txt || true)
          echo "forbidden-string hits (main history): $hits"
          [ "$hits" = "0" ]
      - name: No AI attribution in the tree or recent commits
        run: bash scripts/check-no-ai-attribution.sh
