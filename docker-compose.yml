# OrbStack:  HOST_PORT=7810 docker compose up --build -d   ->  http://127.0.0.1:7810
# The server binds 0.0.0.0 INSIDE the container (AIDEMOLAB_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay 7810 (this app's one allocated port).
name: ai-demo-standalone

services:
  ai-demo-standalone:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-7810}:7810"
    environment:
      PORT: "7810"
      AIDEMOLAB_BIND: 0.0.0.0
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-ai-demo-standalone.local.ping-devops.com}
      # Durable workspace stores + a stable workspace-signing key (set in .env to survive restarts).
      AIDEMOLAB_STATE_DIR: /state
      AIDEMOLAB_SERVER_KEY: ${AIDEMOLAB_SERVER_KEY:-}
      # Owner-run pass-throughs (empty by default; the values live in .env beside this file and are
      # NEVER baked into the image): P10 Real sign-in and the Real token exchange. compose auto-loads
      # .env for interpolation, so these reach the container only when the .env actually sets them.
      AIDEMOLAB_SIGNIN_PROVIDER: ${AIDEMOLAB_SIGNIN_PROVIDER:-}
      AIDEMOLAB_SIGNIN_CLIENT_ID: ${AIDEMOLAB_SIGNIN_CLIENT_ID:-}
      AIDEMOLAB_SIGNIN_CLIENT_SECRET: ${AIDEMOLAB_SIGNIN_CLIENT_SECRET:-}
      AIDEMOLAB_SIGNIN_USERNAME: ${AIDEMOLAB_SIGNIN_USERNAME:-}
      AIDEMOLAB_SIGNIN_BASE_URL: ${AIDEMOLAB_SIGNIN_BASE_URL:-}
      PINGONE_ENVIRONMENT_ID: ${PINGONE_ENVIRONMENT_ID:-}
      PINGONE_REGION: ${PINGONE_REGION:-}
      AIDEMOLAB_REAL_URL: ${AIDEMOLAB_REAL_URL:-}
      AIDEMOLAB_REAL_CLIENT_ID: ${AIDEMOLAB_REAL_CLIENT_ID:-}
      AIDEMOLAB_REAL_CLIENT_SECRET: ${AIDEMOLAB_REAL_CLIENT_SECRET:-}
    read_only: true
    volumes:
      - ws-state:/state
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7810/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
  # P2b: the LangGraph brain sidecar. OFF by default (the `brain` profile); publishes NO
  # host port and shares the lab's network namespace, so the model URL the sidecar dials is
  # the same loopback the lab itself is allowed to dial (netguard governs both).
  brain:
    build:
      context: .
      dockerfile: brain/Dockerfile
    profiles: ["brain"]
    network_mode: "service:ai-demo-standalone"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      AIDEMO_BRAIN_URL: ${AIDEMO_BRAIN_URL:-}
      AIDEMO_BRAIN_MODEL: ${AIDEMO_BRAIN_MODEL:-gpt-oss-20b}
      AIDEMOLAB_BRAIN_SECRET: ${AIDEMOLAB_BRAIN_SECRET:-}
      AIDEMOLAB_TOOL_URL: http://127.0.0.1:7810/api/assistant/tool
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ws-state:
